name: Deploy to Beta

# Trunk-based: every commit that lands on main and passes CI becomes beta.
# Promotion to production is a version tag (see deploy-production.yml).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dansbart

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: api
            context: ./backend/api
            dockerfile: ./backend/api/Dockerfile
          - service: feature-worker
            context: ./backend/workers/feature
            dockerfile: ./backend/workers/feature/Dockerfile
          - service: audio-worker
            context: ./backend/workers/audio
            dockerfile: ./backend/workers/audio/Dockerfile

    steps:
      # workflow_run checks out the default branch HEAD by default, not the
      # commit CI actually validated. With two commits landing close together
      # that silently ships the wrong code, so pin to the tested SHA.
      - name: Resolve tested commit
        id: commit
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=beta
            type=raw,value=${{ steps.commit.outputs.sha }}

      - name: Compute frontend build args
        id: build-args
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            {
              echo "args<<EOF"
              echo "FARO_API_KEY=${{ secrets.FARO_API_KEY }}"
              echo "FARO_UPLOAD_ENDPOINT=${{ vars.FARO_UPLOAD_ENDPOINT }}"
              echo "FARO_APP_ID=${{ vars.FARO_APP_ID }}"
              echo "FARO_STACK_ID=${{ vars.FARO_STACK_ID }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.args }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:buildcache,mode=max
          platforms: linux/amd64

  notify:
    name: Notify deployment
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tested commit
        id: commit
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Deployment itself lives in a separate private Ansible repo. Set the
      # DEPLOY_DISPATCH_REPO variable (owner/name) and a DEPLOY_DISPATCH_TOKEN
      # secret with repo scope there to have it pulled automatically; without
      # them this step is skipped and images simply wait to be pulled manually.
      - name: Trigger deployment repository
        if: vars.DEPLOY_DISPATCH_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ vars.DEPLOY_DISPATCH_REPO }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          payload=$(jq -n --arg sha "$SHA" \
            '{event_type: "dansbart-beta", client_payload: {sha: $sha, environment: "beta", tag: "beta"}}')
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET_REPO/dispatches" \
            -d "$payload"
          echo "Dispatched dansbart-beta to $TARGET_REPO"

      - name: Summary
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "## Beta images pushed"
            echo ""
            echo "Commit: \`$SHA\`"
            echo ""
            echo "| Image | Tags |"
            echo "|-------|------|"
            for svc in frontend api feature-worker audio-worker; do
              echo "| \`${REGISTRY}/${IMAGE_PREFIX}-${svc}\` | \`beta\`, \`${SHA}\` |"
            done
            echo ""
            if [ -z "${{ vars.DEPLOY_DISPATCH_REPO }}" ]; then
              echo "_No DEPLOY_DISPATCH_REPO configured; pull these manually from the Ansible repo._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
