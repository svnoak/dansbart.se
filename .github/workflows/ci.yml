name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR push previously triggered CI twice (once via push on '**', once via
# pull_request). Pushes are now limited to main; everything else arrives as a PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      feature-worker: ${{ steps.filter.outputs.feature-worker }}
      audio-worker: ${{ steps.filter.outputs.audio-worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'backend/api/**'
            feature-worker:
              - 'backend/workers/feature/**'
            audio-worker:
              - 'backend/workers/audio/**'
            frontend:
              - 'frontend/**'
            migrations:
              - 'backend/api/src/main/resources/db/migration/**'

  migrations:
    name: Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Flyway records a checksum per applied migration. Editing a file that has
      # already run against beta or production makes startup fail with a checksum
      # mismatch, so existing migrations are append-only.
      - name: Reject edits to already-committed migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          edited=$(git diff --name-only --diff-filter=MDR "$merge_base" HEAD \
            -- backend/api/src/main/resources/db/migration/)
          if [ -n "$edited" ]; then
            echo "::error::Existing migrations were modified, deleted or renamed. Add a new migration instead:"
            echo "$edited"
            exit 1
          fi
          echo "Migration history is append-only."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # generate-sources runs the flyway-maven-plugin then jOOQ codegen, so this
      # proves migrations apply to an empty database AND that the committed jOOQ
      # sources still match the resulting schema.
      - name: Apply all migrations to an empty database
        working-directory: backend/api
        run: |
          mvn -B generate-sources \
            -Djooq.codegen.jdbc.url=jdbc:postgresql://localhost:5432/test_db \
            -Djooq.codegen.jdbc.user=test \
            -Djooq.codegen.jdbc.password=test

  test-java-api:
    name: Java API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Java tests
        working-directory: backend/api
        run: mvn test -B -DskipDbBuild=true

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Run type check
        working-directory: frontend
        run: npm run type-check

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  feature-worker:
    name: Feature Worker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Matches the 3.11 base image in backend/workers/feature/Dockerfile.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/workers/feature/requirements.txt

      - name: Install linters
        run: pip install black flake8 isort

      - name: Run black
        working-directory: backend/workers/feature
        run: black --check app tests

      - name: Run isort
        working-directory: backend/workers/feature
        run: isort --check-only app tests

      - name: Run flake8
        working-directory: backend/workers/feature
        run: flake8 app tests

      - name: Install dependencies
        working-directory: backend/workers/feature
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        working-directory: backend/workers/feature
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_SERVER: localhost
          POSTGRES_DB: test_db
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
        run: |
          pytest tests/ --tb=short \
            --ignore=tests/e2e/test_youtube_fetch.py \
            --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: backend/workers/feature/coverage.xml
          flags: feature-worker
          fail_ci_if_error: false

  audio-worker:
    name: Audio Worker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Matches the 3.10 base image in backend/workers/audio/Dockerfile.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/workers/audio/requirements.txt

      - name: Install linters
        run: pip install black flake8 isort

      - name: Run black
        working-directory: backend/workers/audio
        run: black --check app tests

      - name: Run isort
        working-directory: backend/workers/audio
        run: isort --check-only app tests

      - name: Run flake8
        working-directory: backend/workers/audio
        run: flake8 app tests

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      # madmom (via neckenml-analyzer) has no wheel and needs numpy + Cython
      # present before its setup.py runs. Same ordering as the worker Dockerfile.
      - name: Install Python dependencies
        working-directory: backend/workers/audio
        run: |
          python -m pip install --upgrade pip
          pip install numpy Cython
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-env

      - name: Run tests
        working-directory: backend/workers/audio
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
        run: |
          pytest tests/ --tb=short -m "not integration" \
            --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: backend/workers/audio/coverage.xml
          flags: audio-worker
          fail_ci_if_error: false

  docker-build-api:
    name: Docker Build (API)
    runs-on: ubuntu-latest
    needs: [test-java-api, detect-changes]
    if: needs.detect-changes.outputs.api == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/api
          file: ./backend/api/Dockerfile
          push: false
          tags: dansbart-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-feature-worker:
    name: Docker Build (Feature Worker)
    runs-on: ubuntu-latest
    needs: [feature-worker, detect-changes]
    if: needs.detect-changes.outputs.feature-worker == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Feature Worker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/workers/feature
          file: ./backend/workers/feature/Dockerfile
          push: false
          tags: dansbart-feature-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-audio-worker:
    name: Docker Build (Audio Worker)
    runs-on: ubuntu-latest
    needs: [audio-worker, detect-changes]
    if: needs.detect-changes.outputs.audio-worker == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Audio Worker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/workers/audio
          file: ./backend/workers/audio/Dockerfile
          push: false
          tags: dansbart-audio-worker:test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-frontend:
    name: Docker Build (Frontend)
    runs-on: ubuntu-latest
    needs: [test-frontend, detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: dansbart-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single required status check. Branch protection should require "CI Gate"
  # rather than the individual jobs, so that conditional docker builds skipping
  # does not block a merge, but any real failure does.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - migrations
      - test-java-api
      - test-frontend
      - feature-worker
      - audio-worker
      - docker-build-api
      - docker-build-feature-worker
      - docker-build-audio-worker
      - docker-build-frontend

    steps:
      - name: Verify no job failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort

          bad=$(echo "$NEEDS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')

          if [ -n "$bad" ]; then
            echo "::error::CI failed. Jobs not successful:"
            echo "$bad"
            exit 1
          fi

          echo "All jobs succeeded or were skipped."
