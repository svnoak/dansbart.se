name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pushes run CI only on main, so each pull request branch runs CI once.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      feature-worker: ${{ steps.filter.outputs.feature-worker }}
      audio-worker: ${{ steps.filter.outputs.audio-worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            workflow:
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - '.github/actions/**'
            api:
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - '.github/actions/**'
              - 'backend/api/**'
            feature-worker:
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - '.github/actions/**'
              - 'backend/workers/feature/**'
            audio-worker:
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - '.github/actions/**'
              - 'backend/workers/audio/**'
            frontend:
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - '.github/actions/**'
              - 'frontend/**'

  migrations:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.api == 'true'

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Flyway records a checksum per applied migration. Editing a file that has
      # already run against beta or production makes startup fail with a checksum
      # mismatch, so existing migrations are append-only.
      - name: Reject edits to already-committed migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          edited=$(git diff --name-only --diff-filter=MDR "$merge_base" HEAD \
            -- backend/api/src/main/resources/db/migration/)
          if [ -n "$edited" ]; then
            echo "::error::Existing migrations were modified, deleted or renamed. Add a new migration instead:"
            echo "$edited"
            exit 1
          fi
          echo "Migration history is append-only."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # generate-sources runs the flyway-maven-plugin then jOOQ codegen, so this
      # proves migrations apply to an empty database AND that the committed jOOQ
      # sources still match the resulting schema.
      - name: Apply all migrations to an empty database
        working-directory: backend/api
        run: |
          mvn -B generate-sources \
            -Djooq.codegen.jdbc.url=jdbc:postgresql://localhost:5432/test_db \
            -Djooq.codegen.jdbc.user=test \
            -Djooq.codegen.jdbc.password=test

  test-java-api:
    name: Java API Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.api == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Java tests
        working-directory: backend/api
        run: |
          # Start the Testcontainers image pulls while Maven compiles.
          docker pull testcontainers/ryuk:0.5.1 >/dev/null 2>&1 &
          docker pull pgvector/pgvector:pg16 >/dev/null 2>&1 &
          docker pull redis:7-alpine >/dev/null 2>&1 &
          mvn test -B -DskipDbBuild=true

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint, type check, and test
        working-directory: frontend
        run: |
          declare -A pids
          declare -A logs

          for name in lint type-check test:run; do
            log="$RUNNER_TEMP/frontend-${name//:/-}.log"
            npm run "$name" > "$log" 2>&1 &
            pids[$name]=$!
            logs[$name]=$log
          done

          failed=0
          for name in "${!pids[@]}"; do
            if ! wait "${pids[$name]}"; then
              failed=1
              echo "::error::$name failed"
            fi
          done

          for name in lint type-check test:run; do
            echo "::group::$name"
            cat "${logs[$name]}"
            echo "::endgroup::"
          done

          exit $failed

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  feature-worker:
    name: Feature Worker
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.feature-worker == 'true'

    # The Spotify task tests store Celery results in Redis.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Matches the 3.11 base image in backend/workers/feature/Dockerfile.
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache venv
        id: venv
        uses: ./.github/actions/cache-python-venv
        with:
          venv-path: backend/workers/feature/.venv
          requirements-file: backend/workers/feature/requirements.txt
          python-version: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        working-directory: backend/workers/feature
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install black flake8 isort
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest pytest-cov pytest-asyncio

      - name: Run black
        working-directory: backend/workers/feature
        run: black --check app tests

      - name: Run isort
        working-directory: backend/workers/feature
        run: isort --check-only app tests

      - name: Run flake8
        working-directory: backend/workers/feature
        run: flake8 app tests

      - name: Run tests
        working-directory: backend/workers/feature
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_SERVER: localhost
          POSTGRES_DB: test_db
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
        run: |
          pytest tests/ --tb=short \
            --ignore=tests/e2e/test_youtube_fetch.py \
            --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: backend/workers/feature/coverage.xml
          flags: feature-worker
          fail_ci_if_error: false

  audio-worker:
    name: Audio Worker
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.audio-worker == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Matches the 3.10 base image in backend/workers/audio/Dockerfile.
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Cache venv
        id: venv
        uses: ./.github/actions/cache-python-venv
        with:
          venv-path: backend/workers/audio/.venv
          requirements-file: backend/workers/audio/requirements.txt
          python-version: ${{ steps.setup-python.outputs.python-version }}

      # madmom (via neckenml-analyzer) has no wheel and needs numpy + Cython
      # present before its setup.py runs. Same ordering as the worker Dockerfile.
      - name: Install dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        working-directory: backend/workers/audio
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install black flake8 isort
          .venv/bin/pip install numpy Cython
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest pytest-cov pytest-env

      - name: Run black
        working-directory: backend/workers/audio
        run: black --check app tests

      - name: Run isort
        working-directory: backend/workers/audio
        run: isort --check-only app tests

      - name: Run flake8
        working-directory: backend/workers/audio
        run: flake8 app tests

      - name: Run tests
        working-directory: backend/workers/audio
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
        run: |
          pytest tests/ --tb=short -m "not integration" \
            --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: backend/workers/audio/coverage.xml
          flags: audio-worker
          fail_ci_if_error: false

  docker-build-api:
    name: Docker Build (API)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.api == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/api
          file: ./backend/api/Dockerfile
          push: false
          tags: dansbart-api:test
          cache-from: type=gha,scope=api
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=api,mode=max' || '' }}

  docker-build-feature-worker:
    name: Docker Build (Feature Worker)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.feature-worker == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Feature Worker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/workers/feature
          file: ./backend/workers/feature/Dockerfile
          push: false
          tags: dansbart-feature-worker:test
          cache-from: type=gha,scope=feature-worker
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=feature-worker,mode=max' || '' }}

  docker-build-audio-worker:
    name: Docker Build (Audio Worker)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.audio-worker == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Audio Worker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/workers/audio
          file: ./backend/workers/audio/Dockerfile
          push: false
          tags: dansbart-audio-worker:test
          platforms: linux/amd64
          cache-from: type=gha,scope=audio-worker
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=audio-worker,mode=max' || '' }}

  docker-build-frontend:
    name: Docker Build (Frontend)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: dansbart-frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=frontend,mode=max' || '' }}

  check-workflow:
    name: Workflow Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.workflow == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check CI workflow shape
        run: |
          pip install pyyaml
          python .github/scripts/check_ci_workflow.py .github/workflows/ci.yml

  # Single required status check. Branch protection should require "CI Gate"
  # rather than the individual jobs, so that conditional docker builds skipping
  # does not block a merge, but any real failure does.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - migrations
      - test-java-api
      - test-frontend
      - feature-worker
      - audio-worker
      - docker-build-api
      - docker-build-feature-worker
      - docker-build-audio-worker
      - docker-build-frontend
      - check-workflow

    steps:
      - name: Verify no job failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort

          bad=$(echo "$NEEDS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')

          if [ -n "$bad" ]; then
            echo "::error::CI failed. Jobs not successful:"
            echo "$bad"
            exit 1
          fi

          echo "All jobs succeeded or were skipped."
