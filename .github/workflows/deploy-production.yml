name: Deploy to Production

# Trunk-based: production is cut by tagging a commit that already shipped to
# beta. Pushing to main alone never reaches production.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dansbart

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A tag on a side branch would ship code that never passed through beta.
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit on main."
            echo "Production is cut from main only, so that every release has soaked on beta."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main."

  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [verify-tag]
    # Add required reviewers to the "production" environment in repo settings to
    # turn every release into an approval gate.
    environment: production
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: api
            context: ./backend/api
            dockerfile: ./backend/api/Dockerfile
          - service: feature-worker
            context: ./backend/workers/feature
            dockerfile: ./backend/workers/feature/Dockerfile
          - service: audio-worker
            context: ./backend/workers/audio
            dockerfile: ./backend/workers/audio/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=long

      - name: Compute frontend build args
        id: build-args
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            {
              echo "args<<EOF"
              echo "FARO_API_KEY=${{ secrets.FARO_API_KEY }}"
              echo "FARO_UPLOAD_ENDPOINT=${{ vars.FARO_UPLOAD_ENDPOINT }}"
              echo "FARO_APP_ID=${{ vars.FARO_APP_ID }}"
              echo "FARO_STACK_ID=${{ vars.FARO_STACK_ID }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.args }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:buildcache,mode=max
          platforms: linux/amd64

  notify:
    name: Notify deployment
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      # See deploy-beta.yml: deployment lives in a separate private Ansible repo.
      - name: Trigger deployment repository
        if: vars.DEPLOY_DISPATCH_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ vars.DEPLOY_DISPATCH_REPO }}
          SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          payload=$(jq -n --arg sha "$SHA" --arg version "$VERSION" \
            '{event_type: "dansbart-production",
              client_payload: {sha: $sha, environment: "production", tag: $version}}')
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET_REPO/dispatches" \
            -d "$payload"
          echo "Dispatched dansbart-production to $TARGET_REPO"

      - name: Summary
        env:
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## Production images pushed"
            echo ""
            echo "Release: \`$VERSION\` (\`$SHA\`)"
            echo ""
            echo "| Image | Tags |"
            echo "|-------|------|"
            for svc in frontend api feature-worker audio-worker; do
              echo "| \`${REGISTRY}/${IMAGE_PREFIX}-${svc}\` | \`latest\`, \`${VERSION#v}\`, \`${SHA}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
