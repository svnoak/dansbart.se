name: Release

# Trunk-based: every commit that lands on main and passes CI is built into
# images, tagged with its full SHA and :latest. Deployment is a pull request in
# the deployment repository. This workflow asks that repository to open or
# update it through a repository_dispatch event; merging it there deploys.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dansbart

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: api
            context: ./backend/api
            dockerfile: ./backend/api/Dockerfile
          - service: feature-worker
            context: ./backend/workers/feature
            dockerfile: ./backend/workers/feature/Dockerfile
          - service: audio-worker
            context: ./backend/workers/audio
            dockerfile: ./backend/workers/audio/Dockerfile

    steps:
      # workflow_run checks out the default branch HEAD by default, not the
      # commit CI actually validated. With two commits landing close together
      # that silently ships the wrong code, so pin to the tested SHA.
      - name: Resolve tested commit
        id: commit
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.commit.outputs.sha }}

      - name: Compute frontend build args
        id: build-args
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            {
              echo "args<<EOF"
              echo "FARO_API_KEY=${{ secrets.FARO_API_KEY }}"
              echo "FARO_UPLOAD_ENDPOINT=${{ vars.FARO_UPLOAD_ENDPOINT }}"
              echo "FARO_APP_ID=${{ vars.FARO_APP_ID }}"
              echo "FARO_STACK_ID=${{ vars.FARO_STACK_ID }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.args }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:buildcache,mode=max
          platforms: linux/amd64

  notify:
    name: Open the release pull request
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tested commit
        id: commit
        env:
          RUN_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            message="$PUSH_MESSAGE"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            message="$RUN_MESSAGE"
          fi
          echo "subject=$(printf '%s' "$message" | head -n 1)" >> "$GITHUB_OUTPUT"

      # The deployment repository is private. Set the DEPLOY_DISPATCH_REPO
      # variable (owner/name) and a DEPLOY_DISPATCH_TOKEN secret that can write
      # to it; without them this step is skipped and the images wait to be
      # pinned by hand.
      - name: Dispatch to the deployment repository
        if: vars.DEPLOY_DISPATCH_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ vars.DEPLOY_DISPATCH_REPO }}
          SHA: ${{ steps.commit.outputs.sha }}
          SUBJECT: ${{ steps.commit.outputs.subject }}
        run: |
          payload=$(jq -n --arg sha "$SHA" --arg subject "$SUBJECT" --arg repo "${{ github.repository }}" \
            '{event_type: "dansbart-release", client_payload: {sha: $sha, subject: $subject, repository: $repo}}')
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET_REPO/dispatches" \
            -d "$payload"
          echo "Dispatched dansbart-release for $SHA to $TARGET_REPO"

      - name: Summary
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "## Images pushed"
            echo ""
            echo "Commit: \`$SHA\`"
            echo ""
            echo "| Image | Tags |"
            echo "|-------|------|"
            for svc in frontend api feature-worker audio-worker; do
              echo "| \`${REGISTRY}/${IMAGE_PREFIX}-${svc}\` | \`latest\`, \`${SHA}\` |"
            done
            echo ""
            if [ -z "${{ vars.DEPLOY_DISPATCH_REPO }}" ]; then
              echo "_No DEPLOY_DISPATCH_REPO configured; pin this SHA in the deployment repository by hand._"
            else
              echo "_A release pull request was opened or updated in ${{ vars.DEPLOY_DISPATCH_REPO }}._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
